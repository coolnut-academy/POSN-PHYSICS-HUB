    const db = {
        'mechanics': {
            title: '🔩 กลศาสตร์',
            icon: '🔩',
            subcategories: {
                'kinematics': {
                    title: 'การเคลื่อนที่',
                    content: 
                        '<div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">สรุปเนื้อหา</h3><p>ศึกษาการเคลื่อนที่ของวัตถุโดยไม่สนใจแรงที่เกี่ยวข้อง ครอบคลุมการเคลื่อนที่แนวตรงด้วยความเร่งคงที่ และการเคลื่อนที่แบบโปรเจกไทล์ ซึ่งเป็นการเคลื่อนที่ 2 มิติภายใต้ความเร่งโน้มถ่วง โดยมีหลักการสำคัญคือการแยกคิดแกน x (ความเร็วคงที่) และแกน y (ความเร่งคงที่) อย่างเป็นอิสระต่อกัน</p></div>' +
                        '<div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">สมการสำคัญ</h3><div class="equation">`\\text{แนวตรง: } v = u+at, s = ut+\\frac{1}{2}at^2, v^2=u^2+2as \\\\ \\text{โปรเจกไทล์ (แกน x): } S_x = u_x t \\\\ \\text{โปรเจกไทล์ (แกน y): } S_y = u_y t - \\frac{1}{2}gt^2`</div></div>' +
                        '<div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">ตัวอย่างโจทย์ (แนวข้อสอบปี 67)</h3><p class="mb-2">โปรเจกไทล์พุ่งออกจากจุดกำเนิดด้วยความเร็ว `u` ทำมุม 30° เหนือแกน x และกระทบพื้นเอียงที่ทำมุม 30° ใต้แกน x ที่จุด P จงหาระยะ OP</p><div class="bg-gray-900/50 p-3 rounded-md"><p>1. ตั้งสมการการเคลื่อนที่: `x(t) = (u\\cos30^{\\circ})t`, `y(t) = (u\\sin30^{\\circ})t - \\frac{1}{2}gt^2`</p><p>2. สมการเส้นพื้นเอียงคือ `y = -x\\tan30^{\\circ}`</p><p>3. แทน `x(t)` และ `y(t)` ลงในสมการพื้นเอียงเพื่อหาเวลา `t` ที่กระทบ</p><p>4. `(u\\sin30^{\\circ})t - \\frac{1}{2}gt^2 = -(u\\cos30^{\\circ})t \\cdot \\tan30^{\\circ} \\Rightarrow ut - \\frac{1}{2}gt^2 = 0` (เนื่องจาก `\\sin30^{\\circ} + \\cos30^{\\circ}\\tan30^{\\circ} = 1`)</p><p>5. แก้สมการได้ `t = \\frac{2u}{g}`</p><p>6. หาระยะ `x` และ `y` ณ เวลานั้น แล้วใช้พีทาโกรัสหา `OP = \\sqrt{x^2+y^2} = \\frac{2u^2}{g}`</p></div></div>' +
                        '<div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">เทคนิค & ข้อควรระวัง</h3><ul class="list-disc list-inside space-y-1"><li>แยกคิดแกน x และ y เสมอ โดยมีเวลา `t` เป็นตัวเชื่อม</li><li>กำหนดทิศทางบวก/ลบให้ชัดเจนตั้งแต่ต้น</li></ul></div>'
                },
                'newton_friction': {
                    title: 'กฎของนิวตันและแรงเสียดทาน',
                    content: `
                        <div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">สรุปเนื้อหา</h3><p>กฎการเคลื่อนที่ของนิวตันเป็นหัวใจของกลศาสตร์คลาสสิก โดยกฎข้อที่สอง \`\\sum \\vec{F} = m\\vec{a}\` เป็นสมการหลักในการวิเคราะห์ปัญหาส่วนใหญ่ แรงเสียดทานเป็นแรงต้านการเคลื่อนที่ แบ่งเป็นแรงเสียดทานสถิต (\`f_s\`) ซึ่งมีค่าไม่คงที่ และแรงเสียดทานจลน์ (\`f_k\`) ซึ่งมีค่าคงที่</p></div>
                        <div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">สมการสำคัญ</h3><div class="equation">\`\\sum \\vec{F} = m\\vec{a} \\\\ f_s \\le \\mu_s N \\\\ f_k = \\mu_k N\`</div></div>
                        <div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">ตัวอย่างโจทย์ (แนวข้อสอบปี 64)</h3><p class="mb-2">แผ่น B วางบนแผ่น A ซึ่งวางบนพื้นระดับ สัมประสิทธิ์ความเสียดทานระหว่าง A กับ B คือ \`\\mu\` ถ้าดึงแผ่น A ด้วยความเร่ง \`a\` เงื่อนไขใดที่ทำให้แผ่น B ไถลไปบน A</p><div class="bg-gray-900/50 p-3 rounded-md"><p>1. พิจารณาแผ่น B แรงเดียวที่ทำให้ B เคลื่อนที่ตาม A ในแนวราบคือแรงเสียดทานสถิต \`f_s\`</p><p>2. จากกฎข้อที่สองของนิวตันสำหรับ B: \`f_s = m_B a_B\`</p><p>3. แรงเสียดทานสถิตสูงสุดที่เกิดขึ้นได้คือ \`f_{s,max} = \\mu_s N = \\mu_s m_B g\`</p><p>4. ดังนั้น ความเร่งสูงสุดที่ B จะเคลื่อนที่ตาม A ไปได้โดยไม่ไถลคือ \`a_{B,max} = \\mu_s g\`</p><p>5. ถ้าความเร่งของ A (\`a\`) มากกว่าความเร่งสูงสุดนี้ (\`a > \\mu_s g\`) แผ่น B จะไถล</p></div></div>
                        <div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">เทคนิค & ข้อควรระวัง</h3><ul class="list-disc list-inside space-y-1"><li>วาด Free-Body Diagram (FBD) ทุกครั้ง</li><li>แรงเสียดทานสถิตไม่ได้มีค่าเท่ากับ \`\\mu_s N\` เสมอไป มันจะปรับค่าตามแรงที่พยายามทำให้วัตถุเคลื่อนที่</li></ul></div>
                    `
                },
                'equilibrium': {
                    title: 'สมดุลกล',
                    content: `
                        <div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">สรุปเนื้อหา</h3><p>วัตถุจะอยู่ในสภาวะสมดุลสถิตเมื่อมันหยุดนิ่งและไม่หมุน ซึ่งหมายความว่าแรงลัพธ์และทอร์กลัพธ์ที่กระทำต่อวัตถุต้องเป็นศูนย์ทั้งคู่ โจทย์ส่วนใหญ่มักเป็นการวิเคราะห์แรงบนคาน, บันไดพิงกำแพง หรือวัตถุที่ถูกแขวน</p></div>
                        <div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">สมการสำคัญ</h3><div class="grid md:grid-cols-2 gap-4"><div><p class="font-semibold mb-1">สมดุลต่อการเลื่อนตำแหน่ง</p><div class="equation">\`\\sum F_x = 0 \\\\ \\sum F_y = 0\`</div></div><div><p class="font-semibold mb-1">สมดุลต่อการหมุน</p><div class="equation">\`\\sum \\tau = 0\`</div></div></div></div>
                        <div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">ตัวอย่างโจทย์ (แนวข้อสอบปี 66)</h3><p class="mb-2">แผ่นสี่เหลี่ยมมวล M ยาว L กว้าง b แขวนด้วยเชือกที่จุดกึ่งกลางขอบบน (A) และมีมวล m ห้อยที่มุมล่าง (B) ทำให้แผ่นเอียงทำมุม \`\\theta\` กับแนวระดับ จงหา \`\\tan\\theta\`</p><div class="bg-gray-900/50 p-3 rounded-md"><p>1. เลือกจุดแขวน A เป็นจุดหมุน</p><p>2. ทอร์กจากน้ำหนักแผ่น M (ทวนเข็ม): \`\\tau_M = (Mg)(\\frac{L}{2}\\cos\\theta)\`</p><p>3. ทอร์กจากมวล m (ตามเข็ม): \`\\tau_m = (mg)(\\frac{L}{2}\\cos\\theta + b\\sin\\theta)\`</p><p>4. สมดุลของทอร์ก \`\\tau_M = \\tau_m\`: \`Mg(\\frac{L}{2}\\cos\\theta) = mg(\\frac{L}{2}\\cos\\theta + b\\sin\\theta)\`</p><p>5. จัดรูปสมการ: \`(M-m)g\\frac{L}{2}\\cos\\theta = mgb\\sin\\theta\`</p><p>6. \`\\tan\\theta = \\frac{\\sin\\theta}{\\cos\\theta} = \\frac{(M-m)L}{2mb}\`</p></div></div>
                        <div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">เทคนิค & ข้อควรระวัง</h3><ul class="list-disc list-inside space-y-1"><li>เลือกจุดหมุนให้ฉลาด เพื่อกำจัดแรงที่ไม่ทราบค่า</li><li>แขนของโมเมนต์ต้องตั้งฉากกับแนวแรงเสมอ</li></ul></div>
                    `
                },
                 'work_energy': {
                    title: 'งานและพลังงาน',
                    content: `
                        <div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">สรุปเนื้อหา</h3><p>เป็นอีกวิธีในการวิเคราะห์การเคลื่อนที่โดยพิจารณาปริมาณสเกลาร์ (พลังงาน) แทนปริมาณเวกเตอร์ (แรง) ซึ่งมักจะง่ายกว่าในหลายกรณี หลักการสำคัญคือ กฎการอนุรักษ์พลังงานกล ซึ่งใช้ได้เมื่อไม่มีแรงไม่อนุรักษ์ (เช่น แรงเสียดทาน) มากระทำ และทฤษฎีบทงาน-พลังงานจลน์ ที่เชื่อมโยงงานทั้งหมดที่ทำกับวัตถุกับการเปลี่ยนแปลงพลังงานจลน์</p></div>
                        <div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">สมการสำคัญ</h3><div class="equation">\`W = \\vec{F} \\cdot \\vec{s} = Fs\\cos\\theta \\\\ E_k = \\frac{1}{2}mv^2 \\\\ E_p = mgh \\\\ E_{p,s} = \\frac{1}{2}kx^2 \\\\ W_{\\text{net}} = \\Delta E_k \\\\ E_1 + W_{\\text{non-conservative}} = E_2\`</div></div>
                        <div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">ตัวอย่างโจทย์ (แนวข้อสอบปี 64)</h3><p class="mb-2">ปล่อยมวล m จากหยุดนิ่งที่ระยะ \`x\` จากศูนย์กลางโลก (มวล M, รัศมี R) ให้ตกสู่โลก จะชนบรรยากาศโลกด้วยความเร็วเท่าใด</p><div class="bg-gray-900/50 p-3 rounded-md"><p>1. ใช้กฎอนุรักษ์พลังงานกล: \`E_{\\text{initial}} = E_{\\text{final}}\`</p><p>2. พลังงานเริ่มต้น (ที่ระยะ \`x\`): \`E_k + E_p = 0 + (-\\frac{GMm}{x})\`</p><p>3. พลังงานสุดท้าย (ที่ผิวโลก, ระยะ \`R\`): \`E_k' + E_p' = \\frac{1}{2}mv^2 + (-\\frac{GMm}{R})\`</p><p>4. \`-\\frac{GMm}{x} = \\frac{1}{2}mv^2 - \\frac{GMm}{R}\`</p><p>5. จัดรูปหา \`v^2\`: \`\\frac{1}{2}v^2 = GM(\\frac{1}{R} - \\frac{1}{x})\`</p><p>6. \`v^2 = 2GM(\\frac{x-R}{Rx})\`</p><p>7. เนื่องจาก \`g = \\frac{GM}{R^2}\`, เราสามารถแทน \`GM = gR^2\` ได้: \`v^2 = 2gR^2(\\frac{x-R}{Rx}) = 2gR(1 - \\frac{R}{x})\`</p><p>8. \`v = \\sqrt{2gR(1 - \\frac{R}{x})}\`</p></div></div>
                        <div class="content-card p-4 rounded-lg"><h3 class="text-xl font-bold text-sky-400 mb-2">เทคนิค & ข้อควรระวัง</h3><ul class="list-disc list-inside space-y-1"><li>พลังงานเป็นปริมาณสเกลาร์ ไม่ต้องกังวลเรื่องทิศทาง</li><li>อย่าลืมพลังงานศักย์โน้มถ่วงในรูปทั่วไป \`U_g = -GMm/r\` สำหรับโจทย์ระดับดาวเคราะห์</li><li>หากมีแรงเสียดทาน ให้ใช้สมการ \`E_1 = E_2 + W_f\`</li></ul></div>
                    `
                },
                'momentum': {
                    title: 'โมเมนตัมและการชน',
                    content: `

    const mainCategoriesContainer = document.getElementById('main-categories');
    const subCategoryPage = document.getElementById('sub-category-page');
    const subCategoryTitle = document.getElementById('sub-category-title');
    const subCategoryGrid = document.getElementById('sub-category-grid');
    const contentPage = document.getElementById('content-page');
    const contentTitle = document.getElementById('content-title');
    const contentBody = document.getElementById('content-body');
    const navContainer = document.getElementById('nav-container');

    let navStack = [];
    
    function updateNav() {
        navContainer.innerHTML = '';
        navStack.forEach((navItem, index) => {
            const btn = document.createElement('button');
            btn.className = 'nav-btn px-4 py-2 rounded-lg font-orbitron text-sky-300';
            btn.innerHTML = `&lt; ${navItem.title}`;
            btn.onclick = () => {
                navStack = navStack.slice(0, index + 1);
                const target = navStack.pop(); 
                if (target.type === 'home') showHomePage();
                else if (target.type === 'category') showSubCategoryPage(target.key);
            };
            navContainer.appendChild(btn);
        });
    }

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        window.scrollTo(0, 0);
        updateNav();
    }

    function showHomePage() {
        navStack = [];
        showPage('home-page');
    }

    function showSubCategoryPage(categoryKey) {
        navStack = [{ type: 'home', title: 'HOME' }];
        const category = db[categoryKey];
        subCategoryTitle.innerHTML = `${category.icon} ${category.title}`;
        subCategoryGrid.innerHTML = '';
        for (const subKey in category.subcategories) {
            const sub = category.subcategories[subKey];
            const btn = document.createElement('button');
            btn.className = 'subcategory-btn p-4 rounded-lg text-left';
            btn.innerHTML = `<h3 class="font-orbitron text-lg font-bold text-sky-400">${sub.title}</h3>`;
            btn.onclick = () => showContentPage(categoryKey, subKey);
            subCategoryGrid.appendChild(btn);
        }
        showPage('sub-category-page');
    }

    function showContentPage(categoryKey, subKey) {
        navStack = [
            { type: 'home', title: 'HOME' },
            { type: 'category', title: db[categoryKey].title, key: categoryKey }
        ];
        const sub = db[categoryKey].subcategories[subKey];
        contentTitle.innerHTML = sub.title;
        contentBody.innerHTML = sub.content;
        if (window.renderMathInElement) {
            renderMathInElement(contentBody, {
                delimiters: [
                    {left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false},
                    {left: '`', right: '`', display: false}, {left: '\\[', right: '\\]', display: true},
                    {left: '\\(', right: '\\)', display: false}
                ]
            });
        }
        showPage('content-page');
    }

    function init() {
        for (const key in db) {
            const category = db[key];
            const btn = document.createElement('button');
            btn.className = 'category-btn p-4 rounded-lg text-center';
            btn.innerHTML = `<span class="text-4xl">${category.icon}</span><h2 class="font-orbitron text-lg font-bold mt-2 text-sky-400">${category.title}</h2>`;
            btn.onclick = () => showSubCategoryPage(key);
            mainCategoriesContainer.appendChild(btn);
        }
        showHomePage();
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
